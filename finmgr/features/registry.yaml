# The feature panel's registry: one entry per column of data/features/panel.parquet,
# in the panel's column order (the two index levels first).
#
#   name       the column
#   kind       meta (index and labels) | flag (a 0/1 or boolean state) | feature
#              (a raw feature) | rank / zscore (its per-date cross-sectional rank
#              on [0, 1] and z-score, from finmgr.features.crosssection)
#   source     the finmgr.features module that computes it
#   formula    what it is; p is the price the module uses (adj_close_eur unless
#              the module says otherwise), t the date, windows count venue sessions
#   window     the longest look-back in sessions, null if none
#   direction  the prior on its relation to forward cross-sectional returns:
#              positive (higher is expected to do better), negative, or neutral
#              (no prior, or not a signal). A prior to test, not a finding.
#
# Every build checks that the panel's columns are exactly these names, in this
# order (finmgr.features.panel.check_registry). Columns the modules compute but
# the panel leaves out are listed, with the reason, in panel.EXCLUDED.

columns:
  # --- index and labels ------------------------------------------------------
  - name: date
    kind: meta
    source: data.store
    formula: session date (index level 0)
    window: null
    direction: neutral
  - name: ticker
    kind: meta
    source: data.universe
    formula: Yahoo ticker (index level 1)
    window: null
    direction: neutral
  - name: sector
    kind: meta
    source: data.universe
    formula: sector column of config/universe.csv
    window: null
    direction: neutral

  # --- returns (day 23) ------------------------------------------------------
  - name: ret_1d
    kind: feature
    source: returns
    formula: p[t] / p[t-1] - 1
    window: 1
    direction: negative
  - name: ret_5d
    kind: feature
    source: returns
    formula: p[t] / p[t-5] - 1
    window: 5
    direction: negative
  - name: ret_21d
    kind: feature
    source: returns
    formula: p[t] / p[t-21] - 1
    window: 21
    direction: negative
  - name: ret_63d
    kind: feature
    source: returns
    formula: p[t] / p[t-63] - 1
    window: 63
    direction: positive
  - name: ret_126d
    kind: feature
    source: returns
    formula: p[t] / p[t-126] - 1
    window: 126
    direction: positive
  - name: ret_252d
    kind: feature
    source: returns
    formula: p[t] / p[t-252] - 1
    window: 252
    direction: positive
  - name: logret_1d
    kind: feature
    source: returns
    formula: ln p[t] - ln p[t-1]
    window: 1
    direction: negative
  - name: logret_5d
    kind: feature
    source: returns
    formula: ln p[t] - ln p[t-5]
    window: 5
    direction: negative
  - name: logret_21d
    kind: feature
    source: returns
    formula: ln p[t] - ln p[t-21]
    window: 21
    direction: negative
  - name: logret_63d
    kind: feature
    source: returns
    formula: ln p[t] - ln p[t-63]
    window: 63
    direction: positive
  - name: logret_126d
    kind: feature
    source: returns
    formula: ln p[t] - ln p[t-126]
    window: 126
    direction: positive
  - name: logret_252d
    kind: feature
    source: returns
    formula: ln p[t] - ln p[t-252]
    window: 252
    direction: positive

  # --- momentum (day 24) -----------------------------------------------------
  - name: mom_12_1
    kind: feature
    source: momentum
    formula: p[t-21] / p[t-252] - 1 (the year, skipping its last month)
    window: 252
    direction: positive
  - name: mom_6_1
    kind: feature
    source: momentum
    formula: p[t-21] / p[t-126] - 1 (the half year, skipping its last month)
    window: 126
    direction: positive
  - name: rev_5d
    kind: feature
    source: momentum
    formula: -(p[t] / p[t-5] - 1) (last week's return, sign flipped)
    window: 5
    direction: positive

  # --- volatility and risk (day 25) ------------------------------------------
  - name: vol_21d
    kind: feature
    source: volatility
    formula: std(daily log returns over 21 sessions, ddof=1) * sqrt(252)
    window: 21
    direction: negative
  - name: vol_63d
    kind: feature
    source: volatility
    formula: std(daily log returns over 63 sessions, ddof=1) * sqrt(252)
    window: 63
    direction: negative
  - name: vol_252d
    kind: feature
    source: volatility
    formula: std(daily log returns over 252 sessions, ddof=1) * sqrt(252)
    window: 252
    direction: negative
  - name: downdev_63d
    kind: feature
    source: volatility
    formula: sqrt(mean(min(r, 0)^2) over 63 sessions) * sqrt(252), r daily log returns
    window: 63
    direction: negative
  - name: atr_14_pct
    kind: feature
    source: volatility
    formula: Wilder ATR(14) of the adjusted bar / close
    window: 14
    direction: negative
  - name: mdd_252d
    kind: feature
    source: volatility
    formula: worst peak-to-trough fall of p within t-252..t, as a fraction <= 0
    window: 252
    direction: positive

  # --- trend (day 26) --------------------------------------------------------
  - name: dist_sma_20
    kind: feature
    source: trend
    formula: p[t] / SMA20[t] - 1
    window: 20
    direction: negative
  - name: dist_sma_50
    kind: feature
    source: trend
    formula: p[t] / SMA50[t] - 1
    window: 50
    direction: positive
  - name: dist_sma_200
    kind: feature
    source: trend
    formula: p[t] / SMA200[t] - 1
    window: 200
    direction: positive
  - name: dist_ema_20
    kind: feature
    source: trend
    formula: p[t] / EMA20[t] - 1, alpha = 2/21, seeded with an SMA
    window: 20
    direction: negative
  - name: dist_ema_50
    kind: feature
    source: trend
    formula: p[t] / EMA50[t] - 1, alpha = 2/51, seeded with an SMA
    window: 50
    direction: positive
  - name: dist_ema_200
    kind: feature
    source: trend
    formula: p[t] / EMA200[t] - 1, alpha = 2/201, seeded with an SMA
    window: 200
    direction: positive
  - name: slope_sma_20
    kind: feature
    source: trend
    formula: SMA20[t] / SMA20[t-5] - 1
    window: 25
    direction: positive
  - name: slope_sma_50
    kind: feature
    source: trend
    formula: SMA50[t] / SMA50[t-5] - 1
    window: 55
    direction: positive
  - name: slope_sma_200
    kind: feature
    source: trend
    formula: SMA200[t] / SMA200[t-5] - 1
    window: 205
    direction: positive
  - name: slope_ema_20
    kind: feature
    source: trend
    formula: EMA20[t] / EMA20[t-5] - 1
    window: 25
    direction: positive
  - name: slope_ema_50
    kind: feature
    source: trend
    formula: EMA50[t] / EMA50[t-5] - 1
    window: 55
    direction: positive
  - name: slope_ema_200
    kind: feature
    source: trend
    formula: EMA200[t] / EMA200[t-5] - 1
    window: 205
    direction: positive
  - name: trend_50_200
    kind: flag
    source: trend
    formula: +1 while SMA50 > SMA200, -1 otherwise
    window: 200
    direction: positive
  - name: golden_cross
    kind: flag
    source: trend
    formula: 1 on the bar SMA50 closes above SMA200 after a bar it did not, else 0
    window: 200
    direction: positive
  - name: death_cross
    kind: flag
    source: trend
    formula: 1 on the bar SMA50 closes below SMA200 after a bar it did not, else 0
    window: 200
    direction: negative

  # --- oscillators (day 27); p is adj_close in the listing currency ------------
  - name: rsi_14
    kind: feature
    source: oscillators
    formula: 100 * avgU / (avgU + avgD), Wilder-smoothed up and down close changes, 0..100
    window: 14
    direction: negative
  - name: macd_pct
    kind: feature
    source: oscillators
    formula: (EMA12(p) - EMA26(p)) / p
    window: 26
    direction: positive
  - name: macd_signal_pct
    kind: feature
    source: oscillators
    formula: EMA9(EMA12(p) - EMA26(p)) / p
    window: 34
    direction: positive
  - name: macd_hist_pct
    kind: feature
    source: oscillators
    formula: (macd - macd_signal) / p
    window: 34
    direction: positive
  - name: stoch_k
    kind: feature
    source: oscillators
    formula: 100 * (C - lowest low 14) / (highest high 14 - lowest low 14), 0..100
    window: 14
    direction: negative
  - name: stoch_d
    kind: feature
    source: oscillators
    formula: 3-session SMA of stoch_k
    window: 16
    direction: negative
  - name: bb_pctb
    kind: feature
    source: oscillators
    formula: (C - lower) / (upper - lower), bands SMA20 -/+ 2 * stdev20
    window: 20
    direction: negative

  # --- volume and liquidity (day 28) ---------------------------------------------
  - name: adv_eur_21
    kind: feature
    source: liquidity
    formula: mean of volume * close_eur over 21 sessions (average daily euro value)
    window: 21
    direction: negative
  - name: volume_z_63
    kind: feature
    source: liquidity
    formula: (ln ev[t] - mean) / std of ln ev over t-63..t-1, ev = volume * close_eur
    window: 64
    direction: positive
  - name: obv_flow_21
    kind: feature
    source: liquidity
    formula: (OBV[t] - OBV[t-21]) / sum of euro volume over those 21 sessions, in [-1, 1]
    window: 21
    direction: positive
  - name: tradable
    kind: flag
    source: liquidity
    formula: adv_eur_21 >= EUR 5M; False when unknown
    window: 21
    direction: neutral

  # --- market and sector relatives (day 30) ----------------------------------------
  - name: beta_252
    kind: feature
    source: relative
    formula: cov(r_i, r_m) / var(r_m) of daily log returns over 252 sessions, m = benchmark
    window: 252
    direction: negative
  - name: idio_vol_252
    kind: feature
    source: relative
    formula: sqrt((var(r_i) - cov^2 / var(r_m)) * 252), the residual's annualized vol
    window: 252
    direction: negative
  - name: mom_resid_12_1
    kind: feature
    source: relative
    formula: (l_i[t-21] - l_i[t-252]) - beta_252 * (l_m[t-21] - l_m[t-252]), l = log price
    window: 252
    direction: positive
  - name: mom_12_1_sec
    kind: feature
    source: relative
    formula: mom_12_1 - mean(mom_12_1 over the same sector and date)
    window: 252
    direction: positive
  - name: mom_6_1_sec
    kind: feature
    source: relative
    formula: mom_6_1 - mean(mom_6_1 over the same sector and date)
    window: 126
    direction: positive
  - name: mom_resid_12_1_sec
    kind: feature
    source: relative
    formula: mom_resid_12_1 - mean(mom_resid_12_1 over the same sector and date)
    window: 252
    direction: positive
  - name: rev_5d_sec
    kind: feature
    source: relative
    formula: rev_5d - mean(rev_5d over the same sector and date)
    window: 5
    direction: positive
  - name: vol_63d_sec
    kind: feature
    source: relative
    formula: vol_63d - mean(vol_63d over the same sector and date)
    window: 63
    direction: negative
  - name: dist_sma_200_sec
    kind: feature
    source: relative
    formula: dist_sma_200 - mean(dist_sma_200 over the same sector and date)
    window: 200
    direction: positive

  # --- cross-sectional ranks and z-scores (day 29) ------------------------------
  - name: ret_1d_rank
    kind: rank
    source: crosssection
    formula: (r - 1) / (n - 1), r the average rank of ret_1d among the date's n names; NaN under 10 names
    window: 1
    direction: negative
  - name: ret_1d_z
    kind: zscore
    source: crosssection
    formula: (ret_1d - mean) / std across the date's names (ddof=0); NaN under 10 names
    window: 1
    direction: negative
  - name: ret_5d_rank
