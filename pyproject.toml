[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finmgr"
version = "0.1.0"
description = "Personal quantitative research tool: ingest, score and backtest a 100-company universe."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Alberto Garcia de la Torre", email = "alberto@prompt2print.xyz" },
]

# Pinned on purpose: this project runs unattended every evening for two months.
# A silent upgrade of pandas or yfinance mid-roadmap is a debugging session
# nobody asked for. Bump deliberately, never incidentally.
dependencies = [
    "yfinance==1.7.0",
    "pandas==3.0.5",
    "numpy==2.4.6",
    "pyarrow==25.0.1",
    "duckdb==1.5.5",
    "scikit-learn==1.9.1",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "pyyaml==6.0.3",
    "typer==0.27.2",
    "rich==15.0.0",
    "matplotlib==3.11.2",
    "pytest==9.1.1",
]

[project.optional-dependencies]
# Pinned for the same reason as the runtime deps: a ruff release can add or
# change lints, and `make lint` going red on code nobody touched is a waste of
# a session. `make install` puts this extra in .venv.
dev = [
    "ruff==0.16.8",
    "pre-commit==4.6.2",
]

[project.scripts]
finmgr = "finmgr.cli:run"

[project.urls]
Repository = "https://github.com/Alberto-Garcia-de-la-Torre/Financial_manager"

[tool.setuptools.packages.find]
include = ["finmgr*"]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
# -ra summarises everything that wasn't a plain pass; the two --strict flags
# turn a typo in a marker or in this config into an error instead of silence.
addopts = "-ra --strict-markers --strict-config --showlocals"
# A warning from our own code is a defect report that arrives early. Anything
# genuinely out of our hands gets an explicit ignore line here, with a reason.
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py311"
# automation/ is the unattended roadmap runner and is off limits to the daily
# sessions, so it is not ours to reformat. scratch/ is the pre-project yfinance
# code kept as reference on day 1 — deliberately frozen, deliberately unlinted.
#
# Markdown is excluded too: ruff formats Python fenced blocks inside .md, and
# the prose here — README, ROADMAP — is written for people, not for the
# formatter.
extend-exclude = ["automation", "scratch", "*.md"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # import sorting
    "UP",   # pyupgrade: this is a 3.11+ project, write it that way
    "B",    # bugbear
    "SIM",  # simplifications
    "C4",   # comprehensions
    "ARG",  # unused arguments
    "PTH",  # pathlib over os.path — the data layer is all paths
    "RUF",
]

[tool.ruff.format]
docstring-code-format = true
